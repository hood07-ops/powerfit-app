<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerFit 360 CPS</title>
  <!-- CPS_BUILD=20260916-r8 -->
  <style>
    :root{color-scheme:dark;--bg:#08090c;--panel:#17191f;--soft:#242733;--line:#3a3f4f;--gold:#ffc400;--red:#ef233c;--green:#19c463;--text:#f7f7fb;--muted:#b7bdca}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;background:#0d0f14f2;border-bottom:1px solid var(--line)}
    h1,h2,h3{margin:0}h1{color:var(--gold);font-size:clamp(24px,4vw,42px)}main{max-width:1180px;margin:0 auto;padding:22px 16px 54px}
    button{border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;background:var(--gold);color:#111}button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}button.admin{background:var(--red);color:white}button:disabled{opacity:.55;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.route{border-left:5px solid var(--gold)}.muted{color:var(--muted)}
    .route-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.current-box{margin-top:14px;padding:14px;border:1px solid #454b5d;border-radius:14px;background:linear-gradient(180deg,#20242e,#17191f)}.current-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.current-value{font-size:24px;font-weight:900;margin-top:4px}.next-label{font-size:13px;color:var(--muted);margin-top:7px}
    .belt{height:28px;border-radius:8px;border:2px solid #666;min-width:150px;box-shadow:inset 0 0 0 1px #0008,0 5px 20px #0005}.belt-wrap{display:grid;gap:6px;justify-items:end}.belt-name{font-size:13px;font-weight:900;color:#fff}
    .progress-block{display:grid;gap:7px;margin-top:14px}.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800}.progress{height:12px;background:#0c0e13;border:1px solid #3a3f4f;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#ef233c,#ffc400);border-radius:inherit;transition:width .3s ease}.progress.total>span{background:linear-gradient(90deg,#6f42c1,#19c463)}
    .status{display:inline-flex;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;background:var(--soft);color:var(--muted)}.status.unlocked{color:#07140b;background:var(--green)}.status.locked{color:white;background:#4a4f60}
    .tomos{display:grid;gap:10px;margin-top:16px}.tomo{display:grid;gap:10px;background:#20232c;border:1px solid var(--line);border-radius:12px;padding:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.section-title{margin:24px 0 10px;color:var(--gold);font-size:18px}pre{white-space:pre-wrap;line-height:1.5;color:#eef1f8;font-family:Arial,Helvetica,sans-serif}.card-list,.question-list{display:grid;gap:10px}.tech-card,.question-card{background:#20232c;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}.question-card textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#0d1016;color:#fff;padding:11px;font:inherit}.question-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.question-saved{color:var(--green);font-weight:800}.error{border-color:var(--red);color:#ffd4da}.upload-note{font-size:13px;color:var(--muted);line-height:1.4}.upload-state{font-size:13px;font-weight:700;min-height:18px}.start{border:1px solid var(--gold);background:#18150a}.start h2{color:var(--gold)}
    @media(max-width:640px){header{align-items:flex-start;flex-direction:column}.belt-wrap{justify-items:start}.current-value{font-size:21px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div><h1>PowerFit 360 CPS</h1><div class="muted">Sistema de progresión técnica</div></div><div class="actions"><a id="adminLink" href="/cps-admin.html" style="display:none;color:var(--gold);font-weight:800">Administrador CPS</a><a href="/" style="color:var(--gold);font-weight:800">Volver a PowerFit</a></div></header>
<main><section id="state" class="panel">Cargando CPS...</section><section id="routes" class="grid" style="margin-top:16px"></section><section id="detail"></section></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.4";
const supabase=createClient("https://sabsmurhriohwmczaktn.supabase.co","sb_publishable_tj-oblYhYqN5sKWFrrxe1g_NzimyN0p");
const stateEl=document.querySelector('#state'),routesEl=document.querySelector('#routes'),detailEl=document.querySelector('#detail');let home=null;
const money=v=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(v||0));
const humanError=m=>String(m||'No se pudo completar la acción.');
const isUnlocked=s=>['UNLOCKED','GRANTED','IN_PROGRESS','CARDS_COMPLETE','TOMO_TEST_ELIGIBLE','TOMO_TEST_PASSED','TOMO_COMPLETED'].includes(String(s));
const isCompleted=s=>String(s||'').toUpperCase()==='TOMO_COMPLETED';
const canDownload=s=>['UNLOCKED','GRANTED','TOMO_COMPLETED'].includes(String(s));
const safeName=v=>String(v||'').replace(/[^a-z0-9._-]+/gi,'_');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const videoFinal=s=>['VIDEO_APPROVED','LIVE_PENDING','LIVE_APPROVED','COMPLETED'].includes(String(s||'').toUpperCase());
const pct=(done,total)=>total?Math.max(0,Math.min(100,Math.round(done*100/total))):0;
const beltStyle=label=>{const k=String(label||'').toLowerCase();if(k.includes('café-negro')||k.includes('cafe-negro'))return'background:linear-gradient(90deg,#6b3f24 0 48%,#111 52% 100%)';if(k.includes('blanco'))return'background:#f5f5f5';if(k.includes('naranjo'))return'background:#ff8c00';if(k.includes('verde'))return'background:#2eaf5d';if(k.includes('azul'))return'background:#2878d8';if(k.includes('café')||k.includes('cafe'))return'background:#7b4b2a';if(k.includes('negro'))return'background:#111';return'background:#555'};

function routeProgress(route){
  const stages=route.stages||[],currentOrder=Number(route.enrollment?.current_stage_order||1),current=stages.find(s=>Number(s.stage_order)===currentOrder)||stages[0],next=stages.find(s=>Number(s.stage_order)===currentOrder+1)||null;
  const currentTomos=current?.tomos||[],currentDone=currentTomos.filter(t=>isCompleted(t.access_status)).length;
  const byNo=new Map();stages.flatMap(s=>s.tomos||[]).forEach(t=>{const key=Number(t.tomo_no);const prev=byNo.get(key);if(!prev||isCompleted(t.access_status))byNo.set(key,t)});
  const totalTomos=[...byNo.values()],totalDone=totalTomos.filter(t=>isCompleted(t.access_status)).length;
  return{current,next,currentDone,currentTotal:currentTomos.length,currentPct:pct(currentDone,currentTomos.length),totalDone,totalTotal:totalTomos.length,totalPct:pct(totalDone,totalTomos.length)};
}

async function loadHome(){
  const{data:userData}=await supabase.auth.getUser();
  if(!userData.user){stateEl.innerHTML="<strong>Sesión requerida.</strong><br><span class='muted'>Ingresa primero en PowerFit 360 y vuelve a abrir CPS.</span>";return}
  const{data,error}=await supabase.rpc('get_powerfit_combat_home_secure');
  if(error){stateEl.className='panel error';stateEl.textContent=humanError(error.message);return}
  home=data;stateEl.className='panel';stateEl.innerHTML=`<strong>Precio actual por tomo:</strong> ${money(home.tomo_price_clp)} <span class="muted">(${home.is_admin?'modo admin disponible':'alumno'})</span>`;renderRoutes();
}

function renderRoutes(){
  document.querySelector('#adminLink').style.display=home.is_admin?'inline-flex':'none';routesEl.innerHTML='';
  const routes=home.routes||[];if(!routes.length){routesEl.innerHTML="<div class='panel'>No hay rutas CPS configuradas.</div>";return}
  routes.forEach(route=>{
    const el=document.createElement('article');
    if(!route.enrollment){el.className='panel route start';el.innerHTML=`<h2>${route.name}</h2><p class="muted">Aún no estás inscrito en esta ruta. Actívala para ver los tomos y poder comprarlos.</p><div class="actions"><button data-enroll="${route.code}">Comenzar ${route.name}</button></div>`;routesEl.appendChild(el);return}
    const p=routeProgress(route),currentLabel=p.current?.label||`Etapa ${route.enrollment.current_stage_order}`,isKick=route.code==='KICKBOXING';
    const levelBlock=isKick?`<div class="belt-wrap"><div class="current-label">Grado que estás cursando</div><div class="belt" style="${beltStyle(currentLabel)}" aria-label="Cinturón ${currentLabel}"></div><div class="belt-name">${currentLabel}</div></div>`:`<div><div class="current-label">Nivel que estás estudiando</div><div class="current-value">${currentLabel}</div>${p.next?`<div class="next-label">Siguiente: ${p.next.label}</div>`:'<div class="next-label">Último nivel de la ruta</div>'}</div>`;
    const tomos=(route.stages||[]).flatMap(stage=>stage.tomos||[]);
    el.className='panel route';
    el.innerHTML=`<div class="route-head"><div><h2>${route.name}</h2><div class="muted">Progresión académica CPS</div></div>${levelBlock}</div><div class="current-box"><div class="progress-block"><div class="progress-row"><span>Avance del ${isKick?'grado':'nivel'} actual</span><span>${p.currentPct}% · ${p.currentDone}/${p.currentTotal}</span></div><div class="progress"><span style="width:${p.currentPct}%"></span></div></div><div class="progress-block"><div class="progress-row"><span>Evolución total en ${route.name}</span><span>${p.totalPct}% · ${p.totalDone}/${p.totalTotal} tomos</span></div><div class="progress total"><span style="width:${p.totalPct}%"></span></div></div></div><div class="actions" style="margin-top:14px">${home.is_admin?`<button class="admin" data-all="${route.code}">Abrir todos los tomos como Admin</button>`:''}</div><div class="tomos">${tomos.map(tomo=>`<div class="tomo"><div><strong>Tomo ${tomo.tomo_no}</strong> - ${tomo.title}</div><span class="status ${isUnlocked(tomo.access_status)?'unlocked':'locked'}">${tomo.access_status}</span><div class="actions">${canDownload(tomo.access_status)?`<button class="secondary" data-detail="${route.code}:${tomo.tomo_no}">Leer tomo</button><button class="secondary" data-download="${route.code}:${tomo.tomo_no}">Descargar tomo</button>`:''}${isUnlocked(tomo.access_status)?'':`<button data-buy="${route.code}:${tomo.tomo_no}">Comprar ${money(tomo.price_clp||home.tomo_price_clp)}</button>`}${home.is_admin&&!isUnlocked(tomo.access_status)?`<button class="admin" data-grant="${route.code}:${tomo.tomo_no}">Activar tomo como Admin</button>`:''}</div></div>`).join('')}</div>`;
    routesEl.appendChild(el)
  })
}

async function enrollPath(pathCode){const route=(home.routes||[]).find(r=>r.code===pathCode);if(!window.confirm(`¿Comenzar la ruta ${route?.name||pathCode}?`))return;stateEl.innerHTML='<strong>Activando ruta CPS...</strong>';const{error}=await supabase.rpc('enroll_powerfit_combat_path_secure',{p_alumno_id:home.student_alumno_id,p_path_code:pathCode,p_reason:'Activacion por alumno desde CPS'});if(error){alert(humanError(error.message));await loadHome();return}await loadHome()}
async function getStudy(pathCode,tomoNo){const{data,error}=await supabase.rpc('get_powerfit_tomo_study_secure',{p_path_code:pathCode,p_tomo_no:Number(tomoNo)});if(error)throw error;return data?.study||data}
async function getQuestions(pathCode,tomoNo){const{data,error}=await supabase.rpc('get_powerfit_tomo_questions_secure',{p_path_code:pathCode,p_tomo_no:Number(tomoNo)});if(error)throw error;return data||[]}
function renderQuestion(q,pathCode,tomoNo){const saved=q.answer_status?`<span class="question-saved">${esc(q.answer_status)}</span>`:'<span class="muted">Sin responder</span>';return`<article class="question-card"><div class="question-meta"><strong>Pregunta ${q.id}</strong><span class="status">${esc(q.question_type||'respuesta')}</span>${saved}</div><div>${esc(q.prompt)}</div><textarea id="answer-${q.id}" placeholder="Escribe tu respuesta aquí...">${esc(q.answer_text||'')}</textarea>${q.feedback?`<div class="muted"><strong>Feedback:</strong> ${esc(q.feedback)}${q.score!=null?` · Puntaje ${q.score}/100`:''}</div>`:''}<div class="actions"><button data-answer="${pathCode}:${tomoNo}:${q.id}">${q.answer_text?'Actualizar respuesta':'Guardar respuesta'}</button></div><div class="upload-state" id="answer-state-${q.id}"></div></article>`}
async function submitAnswer(pathCode,tomoNo,itemId){const state=document.querySelector(`#answer-state-${itemId}`),input=document.querySelector(`#answer-${itemId}`);try{const answer=input?.value?.trim();if(!answer)throw new Error('Escribe una respuesta antes de guardar.');if(state)state.textContent='Guardando respuesta...';const{error}=await supabase.rpc('submit_powerfit_tomo_answer_secure',{p_path_code:pathCode,p_tomo_no:Number(tomoNo),p_exam_item_id:Number(itemId),p_answer_text:answer});if(error)throw error;if(state)state.textContent='Respuesta guardada correctamente.';setTimeout(()=>loadDetail(pathCode,Number(tomoNo)),500)}catch(error){if(state)state.textContent=`Error: ${humanError(error.message)}`}}
function renderCard(card,pathCode,tomoNo){const status=card.video_status||card.status||'AVAILABLE',uploadAllowed=card.video_required&&!videoFinal(status);return`<article class="tech-card"><h3>${card.name}</h3><p>${card.objective||''}</p><p class="muted">${card.video_required?'Video requerido':'Sin video'} | ${card.live_required?'Evaluación presencial':'Sin evaluación presencial'} | Estado: ${card.status||'AVAILABLE'}</p>${card.video_required?`<div class="actions"><button ${uploadAllowed?'':'disabled'} data-video="${pathCode}:${card.id}:${tomoNo}">${uploadAllowed?(String(status).includes('CORRECTION')?'Reenviar video':'Subir video'):'Video aprobado'}</button></div><div class="upload-note">MP4, WebM o MOV. Máximo 100 MB. Video privado.</div><div class="upload-state" id="upload-state-${card.id}">${String(status).startsWith('VIDEO_')?`Estado del video: ${status}`:''}</div>`:''}</article>`}
async function loadDetail(pathCode,tomoNo){detailEl.innerHTML="<div class='panel'>Cargando tomo...</div>";try{const[detailResult,study,questions]=await Promise.all([supabase.rpc('get_powerfit_tomo_detail_secure',{p_path_code:pathCode,p_tomo_no:Number(tomoNo)}),getStudy(pathCode,tomoNo),getQuestions(pathCode,tomoNo)]);if(detailResult.error)throw detailResult.error;const detail=detailResult.data;detailEl.innerHTML=`<h2 class="section-title">1. MATERIAL DE ESTUDIO</h2><section class="panel"><h3>${study?.title||detail.tomo?.title||`Tomo ${tomoNo}`}</h3><p class="muted">Versión: ${study?.study_version||study?.version||detail.tomo?.study_version||'study-v1'} | Acceso: ${study?.access_status||detail.access_status}</p><pre>${study?.content||'Material no disponible.'}</pre></section><h2 class="section-title">2. PREGUNTAS DEL TOMO</h2><p class="muted">Responde con tus propias palabras usando el material que acabas de estudiar. Tus respuestas quedan guardadas en tu ficha.</p><section class="question-list">${questions.length?questions.map(q=>renderQuestion(q,pathCode,tomoNo)).join(''):"<div class='panel'>Este tomo aún no tiene preguntas configuradas.</div>"}</section><h2 class="section-title">3. TARJETAS TÉCNICAS · VIDEO · PRESENCIAL</h2><p class="muted">Estas no son preguntas: son demostraciones prácticas que debes ejecutar y enviar para evaluación.</p><section class="card-list">${(detail.cards||[]).map(card=>renderCard(card,pathCode,tomoNo)).join('')||"<div class='panel'>No hay tarjetas técnicas para este tomo.</div>"}</section>`}catch(error){detailEl.innerHTML=`<div class="panel error">${humanError(error.message)}</div>`}}
async function chooseVideo(pathCode,cardId,tomoNo){const input=document.createElement('input');input.type='file';input.accept='video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov';input.style.display='none';input.addEventListener('change',async()=>{const file=input.files?.[0];if(file)await uploadCardVideo(pathCode,Number(cardId),Number(tomoNo),file);input.remove()},{once:true});document.body.appendChild(input);input.click()}
async function uploadCardVideo(pathCode,cardId,tomoNo,file){const statusEl=document.querySelector(`#upload-state-${cardId}`),allowed=['video/mp4','video/webm','video/quicktime'];if(!allowed.includes(file.type)){alert('Formato no permitido. Usa MP4, WebM o MOV.');return}if(file.size>100*1024*1024){alert('El video supera 100 MB.');return}if(statusEl)statusEl.textContent='Subiendo video...';let storagePath=null;try{const{data:userData}=await supabase.auth.getUser();if(!userData.user)throw new Error('AUTH_REQUIRED');const filename=`${Date.now()}_${safeName(file.name)}`;storagePath=`${userData.user.id}/${safeName(pathCode)}/card_${cardId}/${filename}`;const{error:uploadError}=await supabase.storage.from('cps-technique-submissions').upload(storagePath,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(uploadError)throw uploadError;const{error}=await supabase.rpc('submit_powerfit_card_video_secure',{p_path_code:pathCode,p_card_id:Number(cardId),p_storage_path:storagePath,p_original_filename:file.name});if(error){await supabase.storage.from('cps-technique-submissions').remove([storagePath]);throw error}if(statusEl)statusEl.textContent='Video enviado correctamente para evaluación.';await loadDetail(pathCode,tomoNo)}catch(error){if(statusEl)statusEl.textContent=`Error: ${humanError(error.message)}`;alert(humanError(error.message))}}
async function downloadTomo(pathCode,tomoNo){try{stateEl.innerHTML='<strong>Preparando descarga...</strong>';const study=await getStudy(pathCode,tomoNo),text=[study?.title||`CPS Tomo ${tomoNo}`,`Ruta: ${pathCode}`,`Version: ${study?.study_version||study?.version||'study-v1'}`,'',study?.content||''].join('\n'),filename=`CPS_${safeName(pathCode)}_Tomo_${String(tomoNo).padStart(2,'0')}_Estudio.txt`,form=document.createElement('form');form.method='POST';form.action='/api/download-tomo';form.style.display='none';const fi=document.createElement('input');fi.type='hidden';fi.name='filename';fi.value=filename;const ci=document.createElement('textarea');ci.name='content';ci.value=text;form.append(fi,ci);document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),15000)}catch(error){alert(humanError(error.message));await loadHome()}}
async function buyTomo(pathCode,tomoNo){stateEl.innerHTML='<strong>Conectando con Mercado Pago...</strong>';const{data,error}=await supabase.functions.invoke('create-preference',{body:{payment_type:'cps_tomo',alumno_id:home.student_alumno_id,path_code:pathCode,tomo_no:Number(tomoNo)}});if(error||data?.error){alert(humanError(data?.message||data?.error||error?.message));await loadHome();return}const url=data.init_point||data.sandbox_init_point;if(!url){alert('Mercado Pago no devolvió un enlace de pago.');await loadHome();return}window.location.href=url}
async function grant(pathCode,tomoNo){if(!window.confirm('¿Abrir este tomo como administrador?'))return;const{error}=await supabase.rpc('grant_powerfit_tomo_admin_secure',{p_alumno_id:home.student_alumno_id,p_path_code:pathCode,p_tomo_no:Number(tomoNo),p_reason:'Prueba administrativa CPS'});if(error)alert(humanError(error.message));await loadHome()}
async function grantAll(pathCode){if(!window.confirm('¿Abrir todos los tomos de esta disciplina?'))return;const{error}=await supabase.rpc('grant_powerfit_all_tomos_admin_secure',{p_alumno_id:home.student_alumno_id,p_path_code:pathCode,p_reason:'Prueba administrativa CPS'});if(error)alert(humanError(error.message));await loadHome()}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;const detail=target.dataset.detail?.split(':'),download=target.dataset.download?.split(':'),buy=target.dataset.buy?.split(':'),grantOne=target.dataset.grant?.split(':'),video=target.dataset.video?.split(':'),answer=target.dataset.answer?.split(':');if(target.dataset.enroll)enrollPath(target.dataset.enroll);if(detail)loadDetail(detail[0],Number(detail[1]));if(download)downloadTomo(download[0],Number(download[1]));if(buy)buyTomo(buy[0],Number(buy[1]));if(grantOne)grant(grantOne[0],Number(grantOne[1]));if(video)chooseVideo(video[0],Number(video[1]),Number(video[2]));if(answer)submitAnswer(answer[0],Number(answer[1]),Number(answer[2]));if(target.dataset.all)grantAll(target.dataset.all)});
loadHome();
</script>
</body>
</html>
