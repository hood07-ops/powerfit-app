<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerFit 360 CPS</title>
    <!-- CPS_BUILD=20260915-r2 -->
    <style>
      :root { color-scheme: dark; --bg:#08090c; --panel:#17191f; --soft:#242733; --line:#3a3f4f; --gold:#ffc400; --red:#ef233c; --green:#19c463; --text:#f7f7fb; --muted:#b7bdca; }
      * { box-sizing:border-box; } body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
      header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; background:#0d0f14f2; border-bottom:1px solid var(--line); }
      h1,h2,h3 { margin:0; } h1 { color:var(--gold); font-size:clamp(24px,4vw,42px); } main { max-width:1180px; margin:0 auto; padding:22px 16px 54px; }
      button { border:0; border-radius:8px; padding:12px 14px; font-weight:800; cursor:pointer; background:var(--gold); color:#111; }
      button.secondary { background:var(--soft); color:var(--text); border:1px solid var(--line); } button.admin { background:var(--red); color:white; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
      .route { border-left:5px solid var(--gold); } .muted { color:var(--muted); } .status { display:inline-flex; border-radius:999px; padding:5px 10px; font-weight:800; font-size:12px; background:var(--soft); color:var(--muted); }
      .status.unlocked { color:#07140b; background:var(--green); } .status.locked { color:white; background:#4a4f60; } .tomos { display:grid; gap:10px; margin-top:14px; }
      .tomo { display:grid; gap:10px; background:#20232c; border:1px solid var(--line); border-radius:8px; padding:12px; } .actions { display:flex; gap:10px; flex-wrap:wrap; }
      .section-title { margin:24px 0 10px; color:var(--gold); font-size:18px; } pre { white-space:pre-wrap; line-height:1.5; color:#eef1f8; font-family:Arial,Helvetica,sans-serif; }
      .card-list { display:grid; gap:10px; } .tech-card { background:#20232c; border:1px solid var(--line); border-radius:8px; padding:12px; } .error { border-color:var(--red); color:#ffd4da; }
    </style>
  </head>
  <body>
    <header><div><h1>PowerFit 360 CPS</h1><div class="muted">Sistema de progresion tecnica</div></div><div class="actions"><a id="adminLink" href="/cps-admin.html" style="display:none;color:var(--gold);font-weight:800;">Administrador CPS</a><a href="/" style="color:var(--gold);font-weight:800;">Volver a PowerFit</a></div></header>
    <main><section id="state" class="panel">Cargando CPS...</section><section id="routes" class="grid" style="margin-top:16px;"></section><section id="detail"></section></main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.105.4";
      const supabase = createClient("https://sabsmurhriohwmczaktn.supabase.co","sb_publishable_tj-oblYhYqN5sKWFrrxe1g_NzimyN0p");
      const stateEl=document.querySelector("#state"), routesEl=document.querySelector("#routes"), detailEl=document.querySelector("#detail"); let home=null;
      const money=(value)=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(value||0));
      const humanError=(message)=>String(message).includes("ATTENDANCE_SCHEDULE_MISSING")?"Horario de asistencia aun no configurado. Esto se usara mas adelante para habilitar tu examen de nivel.":String(message||"No se pudo completar la accion.");
      const isUnlocked=(status)=>["UNLOCKED","IN_PROGRESS","CARDS_COMPLETE","TOMO_TEST_ELIGIBLE","TOMO_TEST_PASSED","TOMO_COMPLETED"].includes(status);
      const canDownload=(status)=>["UNLOCKED","GRANTED","TOMO_COMPLETED"].includes(status);
      const safeName=(value)=>String(value||"").replace(/[^a-z0-9_-]+/gi,"_");

      async function loadHome(){
        const {data:userData}=await supabase.auth.getUser(); if(!userData.user){stateEl.innerHTML="<strong>Sesion requerida.</strong><br><span class='muted'>Ingresa primero en PowerFit 360 y vuelve a abrir CPS.</span>";return;}
        const {data,error}=await supabase.rpc("get_powerfit_combat_home_secure"); if(error){stateEl.className="panel error";stateEl.textContent=humanError(error.message);return;}
        home=data; stateEl.className="panel"; stateEl.innerHTML=`<strong>Precio actual por tomo:</strong> ${money(home.tomo_price_clp)} <span class="muted">(${home.is_admin?"modo admin disponible":"alumno"})</span>`; renderRoutes();
      }

      function renderRoutes(){
        document.querySelector("#adminLink").style.display=home.is_admin?"inline-flex":"none"; routesEl.innerHTML="";
        const routes=(home.routes||[]).filter((route)=>route.enrollment); if(!routes.length){routesEl.innerHTML="<div class='panel'>No tienes rutas CPS activas todavia.</div>";return;}
        routes.forEach((route)=>{const el=document.createElement("article");el.className="panel route";const tomos=(route.stages||[]).flatMap((stage)=>stage.tomos||[]);el.innerHTML=`
          <h2>${route.name}</h2><p class="muted">Etapa actual: ${route.enrollment.current_stage_order}</p>
          <div class="actions">${home.is_admin?`<button class="admin" data-all="${route.code}">Abrir todos los tomos como Admin</button>`:""}</div>
          <div class="tomos">${tomos.map((tomo)=>`<div class="tomo"><div><strong>Tomo ${tomo.tomo_no}</strong> - ${tomo.title}</div><span class="status ${isUnlocked(tomo.access_status)?"unlocked":"locked"}">${tomo.access_status}</span><div class="actions">
            ${canDownload(tomo.access_status)?`<button class="secondary" data-detail="${route.code}:${tomo.tomo_no}">Leer tomo</button><button class="secondary" data-download="${route.code}:${tomo.tomo_no}">Descargar tomo</button>`:""}
            ${isUnlocked(tomo.access_status)?"":`<button data-buy="${route.code}:${tomo.tomo_no}">Comprar ${money(tomo.price_clp||home.tomo_price_clp)}</button>`}
            ${home.is_admin&&!isUnlocked(tomo.access_status)?`<button class="admin" data-grant="${route.code}:${tomo.tomo_no}">Activar tomo como Admin</button>`:""}
          </div></div>`).join("")}</div>`;routesEl.appendChild(el);});
      }

      async function getStudy(pathCode,tomoNo){
        const {data,error}=await supabase.rpc("get_powerfit_tomo_study_secure",{p_path_code:pathCode,p_tomo_no:Number(tomoNo)}); if(error) throw error; return data?.study||data;
      }

      async function loadDetail(pathCode,tomoNo){
        detailEl.innerHTML="<div class='panel'>Cargando tomo...</div>";
        try{const [detailResult,study]=await Promise.all([supabase.rpc("get_powerfit_tomo_detail_secure",{p_path_code:pathCode,p_tomo_no:Number(tomoNo)}),getStudy(pathCode,tomoNo)]); if(detailResult.error) throw detailResult.error; const detail=detailResult.data;
          detailEl.innerHTML=`<h2 class="section-title">MATERIAL DE ESTUDIO</h2><section class="panel"><h3>${study?.title||detail.tomo?.title||`Tomo ${tomoNo}`}</h3><p class="muted">Version: ${study?.study_version||study?.version||detail.tomo?.study_version||"study-v1"} | Acceso: ${study?.access_status||detail.access_status}</p><pre>${study?.content||"Material no disponible."}</pre></section><h2 class="section-title">EVALUACION TECNICA</h2><section class="card-list">${(detail.cards||[]).map((card)=>`<article class="tech-card"><h3>${card.name}</h3><p>${card.objective||""}</p><p class="muted">${card.video_required?"Video requerido":"Sin video"} | ${card.live_required?"Evaluacion presencial":"Sin evaluacion presencial"} | Estado: ${card.status}</p></article>`).join("")||"<div class='panel'>No hay tarjetas tecnicas para este tomo.</div>"}</section>`;
        }catch(error){detailEl.innerHTML=`<div class="panel error">${humanError(error.message)}</div>`;}
      }

      async function downloadTomo(pathCode,tomoNo){
        try{const study=await getStudy(pathCode,tomoNo); const text=[study?.title||`CPS Tomo ${tomoNo}`,`Ruta: ${pathCode}`,`Version: ${study?.study_version||study?.version||"study-v1"}`,"",study?.content||""].join("\n"); const blob=new Blob([text],{type:"text/plain;charset=utf-8"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`CPS_${safeName(pathCode)}_Tomo_${String(tomoNo).padStart(2,"0")}_Estudio.txt`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);}catch(error){alert(humanError(error.message));}
      }

      async function buyTomo(pathCode,tomoNo){const {data,error}=await supabase.functions.invoke("create-preference",{body:{payment_type:"cps_tomo",alumno_id:home.student_alumno_id,path_code:pathCode,tomo_no:tomoNo}});if(error||data?.error){alert(humanError(error?.message||data?.message));return;}window.location.href=data.init_point||data.sandbox_init_point;}
      async function grant(pathCode,tomoNo){if(!window.confirm("¿Abrir este tomo como administrador?"))return;const {error}=await supabase.rpc("grant_powerfit_tomo_admin_secure",{p_alumno_id:home.student_alumno_id,p_path_code:pathCode,p_tomo_no:Number(tomoNo),p_reason:"Prueba administrativa CPS"});if(error)alert(humanError(error.message));await loadHome();}
      async function grantAll(pathCode){if(!window.confirm("¿Abrir todos los tomos de esta disciplina?"))return;const {error}=await supabase.rpc("grant_powerfit_all_tomos_admin_secure",{p_alumno_id:home.student_alumno_id,p_path_code:pathCode,p_reason:"Prueba administrativa CPS"});if(error)alert(humanError(error.message));await loadHome();}
      document.addEventListener("click",(event)=>{const target=event.target.closest("button");if(!target)return;const detail=target.dataset.detail?.split(":"),download=target.dataset.download?.split(":"),buy=target.dataset.buy?.split(":"),grantOne=target.dataset.grant?.split(":");if(detail)loadDetail(detail[0],Number(detail[1]));if(download)downloadTomo(download[0],Number(download[1]));if(buy)buyTomo(buy[0],Number(buy[1]));if(grantOne)grant(grantOne[0],Number(grantOne[1]));if(target.dataset.all)grantAll(target.dataset.all);});
      loadHome();
    </script>
  </body>
</html>
