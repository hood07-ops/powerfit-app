<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowerFit 360 + CPS</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}*{box-sizing:border-box}.w{max-width:1150px;margin:auto;padding:16px}.c{background:#111;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0}.r{border-color:#7f1d1d}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input{background:#080808;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;font:inherit}button{background:#b91c1c;border:0;font-weight:800;cursor:pointer}.m{color:#aaa}.hide{display:none!important}.tech{border:1px solid #333;border-radius:12px;padding:10px;margin:8px 0}.pill{display:inline-block;background:#27272a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.good{color:#86efac}.bad{color:#fca5a5}a{color:#fff;text-decoration:none}.top{position:sticky;top:0;background:#050505ee;border-bottom:1px solid #222;z-index:5}
</style>
</head>
<body>
<div class="top"><div class="w row" style="justify-content:space-between;align-items:center"><a href="/"><b style="color:#ef4444">← POWERFIT 360</b></a><div class="row"><a id="adminLink" href="/cps-admin.html" class="pill hide">Administrador CPS</a><button id="out">Salir</button></div></div></div>
<main class="w"><div id="msg"></div>
<section id="login" class="c r"><h1>Mi Camino de Combate</h1><p class="m">Usa la misma cuenta de PowerFit360.</p><div class="g"><input id="email" type="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"></div><button id="go">Ingresar</button></section>
<section id="app" class="hide"><div class="c r"><h1>Mi Camino de Combate</h1><div id="who"></div><p class="m">Boxeo Nivel 1–7 · Kickboxing Blanco→Negro · Tomos $5.000 CLP para alumnos de la Escuela.</p></div><div id="routes" class="g"></div><div id="stage"></div><div id="tomo"></div></section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const s=createClient('https://sabsmurhriohwmczaktn.supabase.co','sb_publishable_tj-oblYhYqN5sKWFrrxe1g_NzimyN0p'),$=q=>document.querySelector(q),B='cps-technique-submissions';
let H=null,P='BOXING';
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=(x,b=0)=>$('#msg').innerHTML=x?`<div class="c ${b?'r':''}">${E(x)}</div>`:'';
async function R(n,a={}){const{data,error}=await s.rpc(n,a);if(error)throw error;return data}
async function load(){
 const{data:{user}}=await s.auth.getUser();
 if(!user){$('#login').classList.remove('hide');$('#app').classList.add('hide');$('#adminLink').classList.add('hide');return}
 $('#login').classList.add('hide');$('#app').classList.remove('hide');
 H=await R('get_powerfit_combat_home_secure');
 const role=String(await R('get_powerfit_effective_role')||'alumno').toLowerCase();
 if(role==='admin')$('#adminLink').classList.remove('hide');else $('#adminLink').classList.add('hide');
 $('#who').innerHTML=`<b>${E(user.email)}</b> · <span class="pill">${E(role)}</span>`;
 renderRoutes();
}
function renderRoutes(){const rs=H?.routes||[];$('#routes').innerHTML=rs.map(r=>{const st=r.stages?.find(x=>x.stage_order===(r.enrollment?.current_stage_order||1));return`<div class="c"><h2>${r.code==='BOXING'?'🥊 Boxeo':'🦵 Kickboxing'}</h2><p>${r.code==='BOXING'?'Nivel 1 → Nivel 7':'Blanco → Negro'}</p><p><b>${r.enrollment?E(st?.label):'Sin inscripción'}</b></p>${!r.enrollment?`<button data-enroll="${r.code}">Inscribirme</button>`:`<button data-path="${r.code}">Abrir camino</button>`}</div>`}).join('');document.querySelectorAll('[data-enroll]').forEach(b=>b.onclick=async()=>{try{await R('enroll_powerfit_combat_path_secure',{p_alumno_id:H.student_alumno_id,p_path_code:b.dataset.enroll,p_reason:'Inscripción web CPS'});await load()}catch(e){M(e.message,1)}});document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>openPath(b.dataset.path))}
async function openPath(path){P=path;try{const d=await R('get_powerfit_combat_path_secure',{p_path_code:path});const st=d?.stages?.find(x=>x.stage_order===(d?.enrollment?.current_stage_order||1));const e=await R('get_powerfit_final_exam_eligibility_secure',{p_alumno_id:H.student_alumno_id,p_path_code:path});$('#stage').innerHTML=`<div class="c r"><h2>${E(st?.label||path)}</h2><p>Tiempo: <b>${e.months_in_stage||0}/${e.minimum_months||st?.minimum_months||0} meses</b> · Asistencia: <b>${e.attendance_pct||0}%</b></p><p>Tarjetas: <b>${e.cards_completed||0}/${e.cards_required||0}</b> · Pruebas tomo: <b>${e.tomos_passed||0}/${e.tomos_required||0}</b></p><p class="${e.eligible?'good':'bad'}"><b>${e.eligible?'APTO PARA EXAMEN FINAL':E(e.message||e.reason||'NO APTO TODAVÍA')}</b></p><div class="g">${(st?.tomos||[]).map(t=>{const u=['UNLOCKED','GRANTED','TOMO_COMPLETED'].includes(t.access_status);return`<div class="tech"><b>Tomo ${String(t.tomo_no).padStart(2,'0')} — ${E(t.title)}</b><p class="m">${E(t.access_status||'LOCKED')} · $5.000 CLP</p>${u?`<button data-tomo="${t.tomo_no}">Abrir</button>`:`<button data-buy="${t.tomo_no}">Comprar $5.000</button>`}</div>`}).join('')}</div></div>`;document.querySelectorAll('[data-tomo]').forEach(b=>b.onclick=()=>openTomo(+b.dataset.tomo));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy))}catch(e){M(e.message,1)}}
async function openTomo(n){try{const d=await R('get_powerfit_tomo_detail_secure',{p_path_code:P,p_tomo_no:n});$('#tomo').innerHTML=`<div class="c"><h2>Tomo ${n}: ${E(d?.tomo?.title||'')}</h2>${(d?.cards||[]).map(c=>`<div class="tech"><div class="row" style="justify-content:space-between"><b>${E(c.name)}</b><span class="pill">${E(c.status||'AVAILABLE')}</span></div>${c.objective?`<p class="m">${E(c.objective)}</p>`:''}${c.video_required&&c.status!=='COMPLETED'?`<input type="file" accept="video/*" data-file="${c.id}"><button data-upload="${c.id}">Enviar video</button>`:''}${c.live_required?'<span class="pill">Presencial obligatoria</span>':''}${c.critical?'<span class="pill bad">Crítica</span>':''}</div>`).join('')}</div>`;document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>upload(b.dataset.upload,n))}catch(e){M(e.message,1)}}
async function upload(card,n){const i=document.querySelector(`[data-file="${card}"]`),f=i?.files?.[0];if(!f)return M('Selecciona un video.',1);try{const{data:{user}}=await s.auth.getUser(),name=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),sp=`${user.id}/${P}/${card}/${Date.now()}-${name}`;const{error}=await s.storage.from(B).upload(sp,f,{upsert:false,contentType:f.type||'video/mp4'});if(error)throw error;await R('submit_powerfit_card_video_secure',{p_path_code:P,p_card_id:+card,p_storage_path:sp,p_original_filename:f.name});M('Video enviado para evaluación.');await openTomo(n)}catch(e){M(e.message,1)}}
async function buy(n){try{const{data,error}=await s.functions.invoke('create-preference',{body:{payment_type:'cps_tomo',alumno_id:H.student_alumno_id,path_code:P,tomo_no:n}});if(error)throw error;const u=data?.init_point||data?.sandbox_init_point;if(!u)throw new Error('Mercado Pago no devolvió enlace.');location.href=u}catch(e){M(e.message,1)}}
$('#go').onclick=async()=>{const{error}=await s.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)return M(error.message,1);load()};
$('#out').onclick=async()=>{await s.auth.signOut();location.href='/'};
s.auth.onAuthStateChange(()=>load());load();
</script>
</body></html>
