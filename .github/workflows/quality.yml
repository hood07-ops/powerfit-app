name: PowerFit Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build default
        run: npm run build

      - name: Build admin
        run: npm run build:admin

      - name: Build coach
        run: npm run build:coach

      - name: Build alumno
        run: npm run build:alumno