name: PowerFit Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Confirm runtime
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Validate shared CPS packages
        run: node scripts/validate-cps-packages.mjs

      - name: Security check
        run: node scripts/security-check.mjs

      - name: Lint
        run: npm run lint

      - name: Build root default
        run: npm run build

      - name: Build root admin
        run: npm run build:admin

      - name: Build root coach
        run: npm run build:coach

      - name: Build root alumno
        run: npm run build:alumno

      - name: Build app PowerFit360 default
        run: npx vite build apps/powerfit360 --config apps/powerfit360/vite.config.js

      - name: Build app PowerFit360 admin
        run: npx vite build apps/powerfit360 --config apps/powerfit360/vite.config.js --mode management

      - name: Build app PowerFit360 coach
        run: npx vite build apps/powerfit360 --config apps/powerfit360/vite.config.js --mode professor_full

      - name: Build app PowerFit360 alumno
        run: npx vite build apps/powerfit360 --config apps/powerfit360/vite.config.js --mode student

      - name: Build app CPS
        run: npx vite build --config apps/cps/vite.config.js
