name: Sync workspace lockfile

on:
  push:
    branches:
      - refactor/monorepo-apps
    paths:
      - package.json
      - apps/*/package.json
      - packages/*/package.json
      - .github/workflows/sync-workspace-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/monorepo-apps

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile for workspaces
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(monorepo): sync workspace lockfile [skip ci]"
          git push origin HEAD:refactor/monorepo-apps
