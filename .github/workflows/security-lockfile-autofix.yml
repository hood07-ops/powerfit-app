name: Security Lockfile Autofix

on:
  push:
    branches: [security/max-hardening]

permissions:
  contents: write

jobs:
  fix-lock:
    if: github.event.head_commit.message != 'security: auto-fix lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/max-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply audit-safe lockfile updates
        run: npm audit fix --package-lock-only
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: auto-fix lockfile"
          git push origin HEAD:security/max-hardening
