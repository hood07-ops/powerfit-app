name: Security Lockfile Autofix

on:
  push:
    branches:
      - security/max-hardening

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/max-hardening
      - name: Stop after autofix commit
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "security: auto-fix lockfile" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: npm ci
      - name: Apply audit-safe lockfile updates
        if: steps.guard.outputs.skip != 'true'
        run: npm audit fix --package-lock-only
      - name: Verify production audit
        if: steps.guard.outputs.skip != 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: auto-fix lockfile"
          git push origin HEAD:security/max-hardening
