name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      POWERFIT_VERSION_CODE: ${{ github.run_number }}
      POWERFIT_TEST_KEYSTORE: ${{ github.workspace }}/android/powerfit-test.keystore
      POWERFIT_TEST_STORE_PASSWORD: powerfit-debug-2026
      POWERFIT_TEST_KEY_ALIAS: powerfit-test
      POWERFIT_TEST_KEY_PASSWORD: powerfit-debug-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -- --configLoader runner

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore stable internal test signing key
        run: |
          base64 --decode android/powerfit-test-keystore.b64 > android/powerfit-test.keystore
          keytool -list -keystore android/powerfit-test.keystore -storepass "$POWERFIT_TEST_STORE_PASSWORD" -alias "$POWERFIT_TEST_KEY_ALIAS" >/dev/null

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: powerfit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk powerfit-debug.apk
          gh release delete debug-apk-latest --yes --cleanup-tag || true
          gh release create debug-apk-latest powerfit-debug.apk \
            --title "PowerFit 360 APK de prueba" \
            --notes "APK de prueba firmado con la clave interna estable de PowerFit. VersionCode: $POWERFIT_VERSION_CODE. La primera instalación con esta firma puede requerir desinstalar una APK antigua; las siguientes podrán actualizarse encima."
