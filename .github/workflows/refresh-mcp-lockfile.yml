name: Refresh MCP Lockfile

on:
  push:
    branches:
      - feat/dastan-mcp-server

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dastan-mcp-server
      - name: Stop after lockfile commit
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: refresh lockfile for mcp server" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        if: steps.guard.outputs.skip != 'true'
        run: npm install --package-lock-only
      - name: Verify clean install
        if: steps.guard.outputs.skip != 'true'
        run: npm ci
      - name: Commit lockfile
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for mcp server"
          git push origin HEAD:feat/dastan-mcp-server
