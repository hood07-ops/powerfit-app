<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerFit 360 CPS Admin</title>
  <!-- CPS_ADMIN_BUILD=20260916-r4 -->
  <style>
    :root{color-scheme:dark;--bg:#07080b;--panel:#15181f;--soft:#222733;--line:#343a49;--gold:#ffc400;--red:#ef233c;--green:#19c463;--blue:#4c8dff;--text:#f8f8fb;--muted:#aeb6c5}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#07080b,#0c0f15);color:var(--text)}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:#0a0d12f2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    h1,h2,h3{margin:0}h1{color:var(--gold);font-size:clamp(24px,4vw,38px)}main{max-width:1280px;margin:0 auto;padding:22px 16px 64px}
    a{color:var(--gold);font-weight:800;text-decoration:none}button{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer;background:var(--gold);color:#111}button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}button.admin{background:var(--red);color:white}button.success{background:var(--green);color:#05120a}button.blue{background:var(--blue);color:white}button:disabled{opacity:.5;cursor:not-allowed}
    .panel{background:linear-gradient(180deg,#171b23,#12151b);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 34px #0003}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.muted{color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 22px}.metric{padding:16px;border-radius:16px;background:#10131a;border:1px solid var(--line)}.metric strong{display:block;font-size:30px;color:var(--gold)}.metric span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 12px}.section-head h2{color:var(--gold);font-size:19px}.queue-card,.student{display:grid;gap:10px}.tag{display:inline-flex;margin:3px 4px 3px 0;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:var(--soft);color:var(--muted)}.tag.critical{background:#54202a;color:#ffd9df}.tag.ok{background:var(--green);color:#07140b}.tag.warn{background:#5d4614;color:#ffe29a}
    .actions{display:flex;flex-wrap:wrap;gap:8px}.error{border-color:var(--red);color:#ffd4da}.route{margin-top:16px;border-left:4px solid var(--gold)}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.small-list{display:grid;gap:8px;max-height:420px;overflow:auto}.row{background:#1d222c;border:1px solid var(--line);border-radius:11px;padding:10px}.unlocked{background:var(--green);color:#07140b}
    .review-shell{margin-top:18px}.review-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:14px}.video-box{background:#080a0e;border:1px solid var(--line);border-radius:14px;padding:10px}.video-box video{width:100%;max-height:62vh;border-radius:10px;background:#000}.form{display:grid;gap:12px}.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:900}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0d1016;color:white;padding:11px;font:inherit}.field textarea{min-height:110px;resize:vertical}.score-total{font-size:28px;font-weight:900;color:var(--gold)}.check{display:flex;gap:8px;align-items:center;font-weight:800}.status-line{min-height:22px;font-weight:900;color:var(--gold)}pre{white-space:pre-wrap;line-height:1.5;font-family:Arial,Helvetica,sans-serif}
    @media(max-width:800px){header{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr}.review-grid{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div><h1>PowerFit 360 CPS Admin</h1><div class="muted">Evaluación, progreso y control académico · build 20260916-r4</div></div><a href="/">Volver a PowerFit</a></header>
<main>
  <section id="state" class="panel">Cargando administrador CPS...</section>
  <section class="summary"><div class="metric"><strong id="videoCount">0</strong><span>Videos pendientes</span></div><div class="metric"><strong id="liveCount">0</strong><span>Evaluaciones presenciales</span></div><div class="metric"><strong id="studentCount">0</strong><span>Alumnos CPS</span></div></section>

  <div class="section-head"><h2>VIDEOS PENDIENTES</h2><button class="secondary" id="refreshBtn">Actualizar</button></div>
  <section id="videos" class="grid"></section>
  <section id="videoReview" class="review-shell"></section>

  <div class="section-head"><h2>EVALUACIONES PRESENCIALES</h2></div>
  <section id="liveQueue" class="grid"></section>
  <section id="liveReview" class="review-shell"></section>

  <div class="section-head"><h2>ALUMNOS CPS</h2></div>
  <section id="students" class="grid"></section>
  <section id="file" style="margin-top:18px"></section>
  <section id="study" style="margin-top:18px"></section>
</main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.4";
const supabase=createClient("https://sabsmurhriohwmczaktn.supabase.co","sb_publishable_tj-oblYhYqN5sKWFrrxe1g_NzimyN0p");
const $=s=>document.querySelector(s),stateEl=$('#state'),videosEl=$('#videos'),liveQueueEl=$('#liveQueue'),studentsEl=$('#students'),fileEl=$('#file'),studyEl=$('#study'),videoReviewEl=$('#videoReview'),liveReviewEl=$('#liveReview');
let videoQueue=[],liveQueue=[],students=[];
const humanError=m=>{const s=String(m||'No se pudo completar la acción.');if(s.includes('ADMIN_REQUIRED'))return'Esta pantalla es sólo para administración CPS.';if(s.includes('FORBIDDEN'))return'No tienes permisos para esta acción.';return s};
const isUnlocked=s=>['UNLOCKED','GRANTED','IN_PROGRESS','CARDS_COMPLETE','TOMO_TEST_ELIGIBLE','TOMO_TEST_PASSED','TOMO_COMPLETED'].includes(String(s));
const canDownload=s=>['UNLOCKED','GRANTED','TOMO_COMPLETED'].includes(String(s));
const safeName=v=>String(v||'').replace(/[^a-z0-9._-]+/gi,'_');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function list(label,items,renderItem){return`<div class="panel"><h3>${label}</h3><div class="small-list">${items.length?items.map(renderItem).join(''):"<div class='muted'>Sin registros</div>"}</div></div>`}
function scoreField(prefix,key,label,max){return`<div class="field"><label>${label} · máx ${max}</label><input class="score" id="${prefix}-${key}" type="number" min="0" max="${max}" step="1" inputmode="numeric" placeholder="0-${max}"></div>`}
function collectScores(prefix,spec){const out={};for(const[k,,max]of spec){const el=$(`#${prefix}-${k}`);const raw=el?.value;if(raw===''||raw==null)throw new Error('Completa todos los puntajes.');const n=Number(raw);if(!Number.isFinite(n)||n<0||n>max)throw new Error(`Puntaje inválido en ${k}.`);out[k]=n}return out}
function bindTotals(prefix,spec,totalId){const calc=()=>{let total=0,max=0;for(const[k,,m]of spec){max+=m;total+=Number($(`#${prefix}-${k}`)?.value||0)}$(`#${totalId}`).textContent=`${total} / ${max}`};spec.forEach(([k])=>$(`#${prefix}-${k}`)?.addEventListener('input',calc));calc()}

async function loadAll(){
  const{data:userData}=await supabase.auth.getUser();if(!userData.user){stateEl.className='panel error';stateEl.textContent='Sesión requerida. Ingresa primero con una cuenta administradora.';return}
  stateEl.className='panel';stateEl.textContent='Actualizando panel CPS...';
  const[v,l,s]=await Promise.all([supabase.rpc('get_powerfit_video_review_queue_secure'),supabase.rpc('get_powerfit_live_assessment_queue_secure'),supabase.rpc('get_powerfit_cps_admin_students_secure')]);
  if(v.error||l.error||s.error){stateEl.className='panel error';stateEl.textContent=humanError(v.error?.message||l.error?.message||s.error?.message);return}
  videoQueue=v.data||[];liveQueue=l.data||[];students=s.data||[];
  $('#videoCount').textContent=videoQueue.length;$('#liveCount').textContent=liveQueue.length;$('#studentCount').textContent=students.length;
  stateEl.className='panel';stateEl.innerHTML='<strong>Panel actualizado.</strong> <span class="muted">Prioriza los elementos críticos y los más antiguos.</span>';
  renderVideos();renderLive();renderStudents();
}
function renderVideos(){videosEl.innerHTML=videoQueue.length?videoQueue.map(v=>`<article class="panel queue-card"><div><h3>${esc(v.alumno_nombre||'Alumno')}</h3><div class="muted">${esc(v.route_code)} · ${esc(v.card_name||`Card ${v.card_id}`)}</div></div><div><span class="tag ${v.critical?'critical':''}">${v.critical?'CRÍTICA':'NORMAL'}</span><span class="tag warn">Intento ${v.attempt_no}</span></div><div class="muted">${esc(v.original_filename||'Video técnico')}</div><button class="blue" data-review-video="${v.submission_id}">Revisar video</button></article>`).join(''):'<div class="panel"><strong>Sin videos pendientes.</strong><div class="muted">La cola está al día.</div></div>'}
async function openVideoReview(id){const item=videoQueue.find(x=>Number(x.submission_id)===Number(id));if(!item)return;videoReviewEl.innerHTML='<div class="panel">Preparando video privado...</div>';try{const{data,error}=await supabase.storage.from('cps-technique-submissions').createSignedUrl(item.storage_path,600);if(error)throw error;const spec=[['guard','Guardia',20],['base','Base',15],['mechanics','Mecánica',15],['kinetic_chain','Cadena cinética',15],['coordination','Coordinación',10],['recovery','Recuperación',10],['control','Control',10],['complete_execution','Ejecución completa',5]];videoReviewEl.innerHTML=`<section class="review-grid"><div class="video-box"><video controls playsinline preload="metadata" src="${esc(data.signedUrl)}"></video><p class="muted">Enlace privado temporal · 10 minutos</p></div><div class="panel form"><div><h2>${esc(item.alumno_nombre)}</h2><div class="muted">${esc(item.route_code)} · ${esc(item.card_name)}</div></div><div class="score-grid">${spec.map(([k,l,m])=>scoreField('vr',k,l,m)).join('')}</div><div><span class="muted">Puntaje</span><div class="score-total" id="vrTotal"></div></div><label class="check"><input id="vrCritical" type="checkbox"> Fallo crítico</label><div class="field"><label>Feedback obligatorio</label><textarea id="vrFeedback" placeholder="Qué hizo bien, qué debe corregir y cómo hacerlo."></textarea></div><div class="actions"><button class="success" id="approveVideo">APROBAR VIDEO</button><button class="admin" id="correctVideo">PEDIR CORRECCIÓN</button><button class="secondary" id="closeVideo">Cerrar</button></div><div class="status-line" id="vrStatus"></div></div></section>`;bindTotals('vr',spec,'vrTotal');$('#closeVideo').onclick=()=>videoReviewEl.innerHTML='';$('#approveVideo').onclick=()=>submitVideoReview(item,'APPROVED',spec);$('#correctVideo').onclick=()=>submitVideoReview(item,'CORRECTION_REQUIRED',spec);videoReviewEl.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){videoReviewEl.innerHTML=`<div class="panel error">${esc(humanError(e.message))}</div>`}}
async function submitVideoReview(item,decision,spec){const status=$('#vrStatus');try{const feedback=$('#vrFeedback').value.trim();if(!feedback)throw new Error('Escribe el feedback antes de guardar.');const scores=collectScores('vr',spec),critical=$('#vrCritical').checked;status.textContent='Guardando evaluación...';const{error}=await supabase.rpc('review_powerfit_card_video_secure',{p_submission_id:Number(item.submission_id),p_decision:decision,p_feedback:feedback,p_scores:scores,p_critical_fail:critical});if(error)throw error;status.textContent='Evaluación guardada correctamente.';setTimeout(async()=>{videoReviewEl.innerHTML='';await loadAll()},500)}catch(e){status.textContent=humanError(e.message)}}

function renderLive(){liveQueueEl.innerHTML=liveQueue.length?liveQueue.map(v=>`<article class="panel queue-card"><div><h3>${esc(v.alumno_nombre||'Alumno')}</h3><div class="muted">${esc(v.route_code)} · ${esc(v.card_name||`Card ${v.card_id}`)}</div></div><div><span class="tag ${v.critical?'critical':''}">${v.critical?'CRÍTICA':'PRESENCIAL'}</span><span class="tag warn">${esc(v.status)}</span></div><button class="blue" data-live="${v.alumno_id}:${v.route_code}:${v.card_id}">Evaluar presencial</button></article>`).join(''):'<div class="panel"><strong>Sin evaluaciones presenciales pendientes.</strong><div class="muted">No hay acciones pendientes.</div></div>'}
function openLiveReview(alumnoId,routeCode,cardId){const item=liveQueue.find(x=>Number(x.alumno_id)===Number(alumnoId)&&x.route_code===routeCode&&Number(x.card_id)===Number(cardId));if(!item)return;const spec=[['reproduce','Reproducción',15],['guard','Guardia',15],['base','Base',15],['correction','Corrección',10],['speed','Velocidad',10],['movement','Movimiento',10],['combination','Combinación',10],['partner','Compañero',10],['safety','Seguridad',5]];liveReviewEl.innerHTML=`<section class="panel form"><div><h2>${esc(item.alumno_nombre)}</h2><div class="muted">${esc(item.route_code)} · ${esc(item.card_name)}</div></div><div class="score-grid">${spec.map(([k,l,m])=>scoreField('lr',k,l,m)).join('')}</div><div><span class="muted">Puntaje</span><div class="score-total" id="lrTotal"></div></div><label class="check"><input id="lrCritical" type="checkbox"> Fallo crítico</label><div class="field"><label>Observaciones</label><textarea id="lrNotes" placeholder="Correcciones, ejecución y recomendaciones."></textarea></div><div class="actions"><button class="success" id="approveLive">APROBAR PRESENCIAL</button><button class="admin" id="correctLive">PEDIR CORRECCIÓN</button><button class="secondary" id="closeLive">Cerrar</button></div><div class="status-line" id="lrStatus"></div></section>`;bindTotals('lr',spec,'lrTotal');$('#closeLive').onclick=()=>liveReviewEl.innerHTML='';$('#approveLive').onclick=()=>submitLive(item,'APPROVED',spec);$('#correctLive').onclick=()=>submitLive(item,'CORRECTION_REQUIRED',spec);liveReviewEl.scrollIntoView({behavior:'smooth',block:'start'})}
async function submitLive(item,decision,spec){const status=$('#lrStatus');try{const scores=collectScores('lr',spec),critical=$('#lrCritical').checked,notes=$('#lrNotes').value.trim()||null;status.textContent='Guardando evaluación presencial...';const{error}=await supabase.rpc('save_powerfit_live_assessment_secure',{p_alumno_id:Number(item.alumno_id),p_path_code:item.route_code,p_card_id:Number(item.card_id),p_decision:decision,p_scores:scores,p_critical_fail:critical,p_notes:notes});if(error)throw error;status.textContent='Evaluación presencial guardada.';setTimeout(async()=>{liveReviewEl.innerHTML='';await loadAll()},500)}catch(e){status.textContent=humanError(e.message)}}

function renderStudents(){studentsEl.innerHTML=students.length?students.map(student=>`<article class="panel student"><div><h3>${esc(student.nombre||'Alumno sin nombre')}</h3><div class="muted">${esc(student.email||'sin email')} · ${esc(student.estado_pago||'Pendiente')}</div></div><div>${(student.routes||[]).map(route=>`<span class="tag">${esc(route.route_code)} ${esc(route.stage_label||'')}</span>`).join('')}</div><div class="muted">Tomos desbloqueados: ${student.unlocked_tomos||0}</div><button data-file="${student.alumno_id}">Abrir ficha CPS</button></article>`).join(''):'<div class="panel">No hay alumnos CPS.</div>'}
async function openFile(alumnoId){studyEl.innerHTML='';fileEl.innerHTML='<div class="panel">Cargando ficha individual...</div>';const{data,error}=await supabase.rpc('get_powerfit_cps_admin_student_file_secure',{p_alumno_id:Number(alumnoId)});if(error){fileEl.innerHTML=`<div class="panel error">${esc(humanError(error.message))}</div>`;return}const student=data.student||{};fileEl.innerHTML=`<section class="panel"><h2>${esc(student.nombre||'Alumno')}</h2><p class="muted">${esc(student.email||'sin email')} · Pago: ${esc(student.estado_pago||'Pendiente')} · Vence: ${esc(student.fecha_vencimiento||'sin fecha')}</p></section>${(data.routes||[]).map(route=>{const access=route.tomo_access||[],enrollment=route.enrollment||{};return`<section class="panel route"><h2>${esc(enrollment.route_code)}</h2><p class="muted">Nivel/grado actual: ${esc(route.stage?.label||enrollment.current_stage_order)}</p><div class="actions"><button class="admin" data-all="${student.alumno_id}:${enrollment.route_code}">Abrir todos los tomos</button></div><div class="columns">${list('Tomos',access,tomo=>`<div class="row"><strong>Tomo ${tomo.tomo_no}</strong> <span class="tag ${isUnlocked(tomo.status)?'unlocked':''}">${esc(tomo.status)}</span><div class="actions" style="margin-top:8px">${canDownload(tomo.status)?`<button class="secondary" data-read="${enrollment.route_code}:${tomo.tomo_no}">Leer</button><button class="secondary" data-download="${enrollment.route_code}:${tomo.tomo_no}">Descargar</button>`:`<button class="secondary" data-grant="${student.alumno_id}:${enrollment.route_code}:${tomo.tomo_no}">Abrir tomo</button>`}</div></div>`)}${list('Tarjetas técnicas',route.card_progress||[],i=>`<div class="row">Card ${i.card_id}: ${esc(i.status||'sin estado')}</div>`)}${list('Videos',route.videos||[],i=>`<div class="row">Card ${i.card_id}: ${esc(i.status||'')}</div>`)}${list('Evaluaciones en vivo',route.evaluaciones||[],i=>`<div class="row">Card ${i.card_id}: ${esc(i.decision||'')}</div>`)}</div></section>`}).join('')}`}
async function getStudy(routeCode,tomoNo){const{data,error}=await supabase.rpc('get_powerfit_tomo_study_secure',{p_path_code:routeCode,p_tomo_no:Number(tomoNo)});if(error)throw error;return data?.study||data}
async function readTomo(routeCode,tomoNo){try{const study=await getStudy(routeCode,tomoNo);studyEl.innerHTML=`<section class="panel"><h2>${esc(study?.title||`Tomo ${tomoNo}`)}</h2><p class="muted">${esc(routeCode)} · ${esc(study?.study_version||study?.version||'study-v1')}</p><pre>${esc(study?.content||'Material no disponible.')}</pre></section>`;studyEl.scrollIntoView({behavior:'smooth'})}catch(e){alert(humanError(e.message))}}
async function downloadTomo(routeCode,tomoNo){try{stateEl.innerHTML='<strong>Preparando descarga segura...</strong>';const study=await getStudy(routeCode,tomoNo),text=[study?.title||`CPS Tomo ${tomoNo}`,`Ruta: ${routeCode}`,`Version: ${study?.study_version||study?.version||'study-v1'}`,'',study?.content||''].join('\n'),filename=`CPS_${safeName(routeCode)}_Tomo_${String(tomoNo).padStart(2,'0')}_Estudio.txt`,form=document.createElement('form');form.method='POST';form.action='/api/download-tomo';form.style.display='none';const fi=document.createElement('input');fi.type='hidden';fi.name='filename';fi.value=filename;const ci=document.createElement('textarea');ci.name='content';ci.value=text;form.append(fi,ci);document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),10000)}catch(e){alert(humanError(e.message));await loadAll()}}
async function grantTomo(alumnoId,routeCode,tomoNo){if(!confirm('¿Abrir este tomo como administrador?'))return;const{error}=await supabase.rpc('grant_powerfit_tomo_admin_secure',{p_alumno_id:Number(alumnoId),p_path_code:routeCode,p_tomo_no:Number(tomoNo),p_reason:'Apertura administrativa CPS'});if(error)alert(humanError(error.message));await openFile(Number(alumnoId));await loadAll()}
async function grantAll(alumnoId,routeCode){if(!confirm('¿Abrir todos los tomos de esta disciplina?'))return;const{error}=await supabase.rpc('grant_powerfit_all_tomos_admin_secure',{p_alumno_id:Number(alumnoId),p_path_code:routeCode,p_reason:'Apertura administrativa CPS'});if(error)alert(humanError(error.message));await openFile(Number(alumnoId));await loadAll()}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.reviewVideo)openVideoReview(t.dataset.reviewVideo);if(t.dataset.live){const[a,r,c]=t.dataset.live.split(':');openLiveReview(a,r,c)}if(t.dataset.file)openFile(Number(t.dataset.file));const grant=t.dataset.grant?.split(':'),all=t.dataset.all?.split(':'),read=t.dataset.read?.split(':'),download=t.dataset.download?.split(':');if(grant)grantTomo(...grant);if(all)grantAll(...all);if(read)readTomo(read[0],read[1]);if(download)downloadTomo(download[0],download[1])});
$('#refreshBtn').onclick=loadAll;loadAll();
</script>
</body>
</html>
